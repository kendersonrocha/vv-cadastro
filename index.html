<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="2; url=https://cursos.lojascacula.com.br/etiqueta-produto/croche/">
  <title>Treinamento TikTok Shop — Redirecionando</title>
  <link rel="preload" as="image" href="rafaela.jpeg">
  <style>
    :root {
      --ink: #0A0A0A;
      --ink-2: #141414;
      --line: #2a2a2a;
      --magenta: #FE2C55;
      --magenta-dark: #c8123e;
      --cyan: #25F4EE;
      --white: #ffffff;
      --muted: #8a8a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ink);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .photo-wrap {
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
      position: relative;
    }
    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      border: 3px solid var(--magenta);
      display: block;
      box-shadow: 0 0 40px rgba(254, 44, 85, 0.25);
    }
    .eyebrow {
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      margin-bottom: 28px;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--ink-2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--magenta);
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 18px 24px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--magenta-dark), 0 8px 24px rgba(254, 44, 85, 0.35);
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--magenta-dark), 0 12px 28px rgba(254, 44, 85, 0.45); }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--magenta-dark), 0 4px 10px rgba(254, 44, 85, 0.35); }
    .small {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="photo-wrap">
      <img src="rafaela.jpeg" alt="Rafaela Freitas" class="photo">
    </div>
    <div class="eyebrow">Treinamento TikTok Shop</div>
    <h1>Quase lá! 🚀</h1>
    <p class="lead">Te levando pro cadastro em instantes...</p>
    <div class="spinner" role="status" aria-label="Carregando"></div>
    <a href="https://cursos.lojascacula.com.br/etiqueta-produto/croche/" class="btn" id="cta" rel="noopener">
      🔥 IR PARA O CADASTRO →
    </a>
    <p class="small">Se a página não abrir sozinha em 2s, toca no botão acima.</p>
  </main>
  <script>
    (function () {
      var dest = "https://cursos.lojascacula.com.br/etiqueta-produto/croche/";
      setTimeout(function () {
        try { window.location.replace(dest); }
        catch (e) { window.location.href = dest; }
      }, 1800);
    })();
  </script>
</body>
</html>
